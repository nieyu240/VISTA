[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vista-game-benchmark"
version = "0.2.0"
description = "Reusable game-agent evaluation, native scoring, traces and paired experiments"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
authors = [
  { name = "Qiushi Han" },
  { name = "Keya Hu" },
  { name = "Linlu Qiu" },
  { name = "Cathy Wu" },
  { name = "Kaiming He" },
]
dependencies = [
  "arc-agi==0.9.9",
  "arcengine==0.9.3",
  "jsonschema>=4.23,<5",
  "numpy==2.5.1",
  "pillow==12.2.0",
  "python-dotenv==1.2.2",
  "requests==2.34.2",
  "urllib3==2.7.0",
]

[project.optional-dependencies]
gameworld = [
  "playwright==1.45.0",
  "PyYAML>=6.0,<7",
  "Jinja2>=3.1,<4",
]
aigamestore = [
  "playwright==1.45.0",
]
dev = [
  "ruff==0.16.3",
]

[project.scripts]
vista = "vista.cli:main"
game-benchmark = "vista.cli:main"

[project.urls]
Repository = "https://github.com/nieyu240/VISTA"
Documentation = "https://github.com/nieyu240/VISTA/blob/benchmark/local-evaluation/README.md"

[tool.setuptools.package-data]
vista = ["core/prompts/*.md"]
"vista.benchmarks.aigamestore" = ["public_games.json"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"src/vista/benchmarks/arc3/controller.py" = ["F401"]

[tool.ruff.lint.isort]
combine-as-imports = true
